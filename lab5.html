<!DOCTYPE html>
<html>
<head>
	<title>Auto Gallery - Registration</title>
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	
</head>
<body>

	<div class="container mt-5">
	
	<h1 class="text-primary">Auto Gallery</h1>
	<h2 class="md-4">Customer Registration</h2>
	
	<form class="col-md-6">
	    <div class="mb-3">
		<label>First Name:</label>
		<input type="text" id="firstName" class="form-control">
		</div>
		
		<div class="mb-3">
		<label>Last Name:</label>
		<input type="text" id="lastName" class="form-control">
		</div>
		
		<div class="mb-3">
		<label>Email Address:</label>
		<input type="email" id="email" class="form-control">
		</div>
		
		<div class="mb-3">
		<label>Password:</label>
		<input type="password" id="password" class="form-control">
		</div>
		
		<div class="mb-3">
		<label>Date of Birth:</label>
		<input type="date" id="dob" class="form-control">
		</div>
		
		<button type="button" class="btn btn-primary" onclick="registerUser()">Register</button>
	</form>
	
	<p id="result"></p>
	
	<script>
	function registerUser() {
		var firstName = document.getElementById("firstName").value;
		var lastName = document.getElementById("lastName").value;
		var email = document.getElementById("email").value;
		var password = document.getElementById("password").value;
		var dob = document.getElementById("dob").value;
		
		if (firstName === "" || lastName === "" || password === "" ||dob === "") {
			document.getElementById("result").innerHTML =
			"<h2>Registration Failed!</h2><p>Please fill in all feilds.</p>";
			return;
		}
		
		if (!password.includes("!") && !password.includes("?")) {
			document.getElementById("result").innerHTML =
				"<h2>Registration Failed!</h2>" +
				"<p>Password must contain ! or ?</p>";
			return;
		}
		
		var user = {
			firstName: firstName,
			lastName: lastName,
			email: email,
			password: password,
			dob: dob
		};
		
		var hiddenPassword = "";
		
		for (var i = 0; i < user.password.length; i++) {
			hiddenPassword = hiddenPassword + "*";
		}
		
		user.password = hiddenPassword;
		
		document.getElementById("result").innerHTML = 
			"<h2>Registration Successful!</h2>" +
			"<p>First Name: " + user.firstName + "</p>" +
			"<p>Last Name: " + user.lastName + "</p>" +
			"<p>Email Address: " + user.email + "</p>" +
			"<p>Password: " + user.password + "</p>" +
			"<p>Date of Birth: " + user.dob + "</P>";
			
	}
	</script> 
	
</div>
</body>
</html>
